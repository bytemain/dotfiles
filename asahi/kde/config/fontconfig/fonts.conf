<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Default families: MiSans (Latin + Simplified Chinese). -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>MiSans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>HarmonyOS Sans SC</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>MiSans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>HarmonyOS Sans SC</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>
  <!-- Keep previously configured families working as fallbacks. -->
  <match target="pattern">
    <test name="family"><string>Inter</string></test>
    <edit name="family" mode="append" binding="weak"><string>MiSans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>HarmonyOS Sans SC</string></test>
    <edit name="family" mode="append" binding="weak"><string>MiSans</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Hack</string></edit>
  </match>

  <!-- Always fall back to CJK + emoji for missing glyphs. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak"><string>MiSans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>HarmonyOS Sans SC</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK SC</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
  </match>

  <!-- macOS-like rendering: grayscale antialiasing, no hinting. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>

</fontconfig>
